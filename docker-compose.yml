services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: darkforce
      POSTGRES_PASSWORD: ${PG_PASSWORD:-darkforce_dev}
      POSTGRES_DB: darkforce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkforce"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [darkforce]

  tor:
    image: ghcr.io/torproject/tor:stable
    command:
      - --SocksPort=0.0.0.0:9050
      - --ControlPort=0.0.0.0:9051
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -e \"AUTHENTICATE\" | nc -w5 127.0.0.1 9051 | grep -q 250'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [darkforce]

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://darkforce:${PG_PASSWORD:-darkforce_dev}@postgres:5432/darkforce
      TOR_EXTERNAL: "socks5h://tor:9050"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data
    networks: [darkforce]

volumes:
  pgdata:
  appdata:

networks:
  darkforce: